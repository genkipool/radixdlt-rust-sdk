name: CI

on:
  push:
    # `develop` too: work lands there first, and a branch nobody checks is a branch
    # whose problems are found after they reach `main`.
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Main workspace: i18n, address, rola, keystore, gateway-tx, sdk.
  main-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets
      - name: Test
        run: cargo test --workspace --all-features

  # radixdlt-connect is an isolated workspace (WebRTC dependency tree).
  connect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/connect
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/connect
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test

  # radixdlt-connect-iroh is an isolated workspace (QUIC/iroh dependency tree).
  connect-iroh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/connect-iroh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/connect-iroh
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test

  # radixdlt-connector-mcp is an isolated workspace (depends on the connect/WebRTC tree).
  connector-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/connector-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/connector-mcp
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test

  # ── Public API compatibility ─────────────────────────────────────────────────────────
  #
  # THE gate a library needs and a binary does not. Removing a public function or narrowing a
  # parameter compiles fine here and fails at the CONSUMER's build, after release. The baseline
  # is the previous commit, because nothing is on crates.io yet and waiting for a first release
  # would mean the first breaking change is found by a user.
  semver:
    name: Public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/qa/semver.sh ${{ github.event.pull_request.base.sha || 'HEAD^' }}

  # ── Documentation ────────────────────────────────────────────────────────────────────
  #
  # For a library the docs ARE the interface: consumers read docs.rs, not the source. A broken
  # intra-doc link is a dead end at the moment someone is trying to understand the API, and it
  # is invisible to `cargo build`.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/qa/docs.sh

  # ── Minimum supported Rust version ───────────────────────────────────────────────────
  #
  # `rust-version` is a promise to consumers. It was 1.80 and false: the tree needs 1.87.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # ── Coverage ─────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/qa/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: target/qa/coverage/

  # ── Supply chain ─────────────────────────────────────────────────────────────────────
  #
  # These crates go to crates.io and the connector binary is installed by agents on other
  # people's machines, so a dependency's advisories AND its licence both matter here.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # ── Mutation testing ─────────────────────────────────────────────────────────────────
  #
  # Coverage says a line ran; this says whether breaking it would be noticed. Scoped to the
  # crates that decide whether a signature is real. Weekly and on demand: too slow for a push.
  mutation:
    name: Mutation testing
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/qa/mutants.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: target/qa/mutants/
