[workspace]
resolver = "2"
members = [
    "crates/i18n",
    "crates/address",
    "crates/rola",
    "crates/keystore",
    "crates/gateway-tx",
    "crates/connect-types",
    "crates/sdk",
]

# Workspace isolated from the PAM project: this tree is the future public
# `radixdlt-rust-sdk` repository (published to crates.io). The application will
# consume it by version/Git later, not by path.

# ── Lints, inherited by every member ─────────────────────────────────────────────────────
#
# This is a PUBLIC library headed for crates.io. The bar is higher than for a binary: what is
# wrong here ships into other people's programs, and what is undocumented here is an interface
# nobody can use without reading the source.
[workspace.lints.rust]
unsafe_code = "deny"
# In a library the documentation IS the interface. An undocumented public item is one a
# consumer has to guess at, which is how a "stable" API gets used in ways it never promised.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# A panic inside a library is taken in the CONSUMER's process, where they cannot catch it and
# did not choose it. Errors must be returned, not thrown.
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
mem_forget = "deny"
lossy_float_literal = "deny"
float_cmp = "deny"

# Silent-wrong-answer hazards. This crate derives addresses and verifies signatures: a
# truncating cast here does not crash, it points money somewhere else.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"

# The public contract, spelled out.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "deny"
# must_use_candidate: dropped. It fired 27 times, nearly all of them on plain getters where
# ignoring the result is not a bug. `#[must_use]` is worth adding by hand where forgetting
# the value really would be one; as a blanket rule it is churn that trains people to stop
# reading the linter.

# Comprehension.
too_many_lines = "warn"
cognitive_complexity = "warn"
redundant_clone = "warn"

todo = "warn"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/genkipool/radixdlt-rust-sdk"
authors = ["Luis Alberto Reoyo Bolaños <68571366+genkipool@users.noreply.github.com>"]
# VERIFIED, not declared by hand: 1.80 was in here and was false — the tree needs edition2024
# (Rust 1.85+) and, through the icu crates, 1.87. Checked toolchain by toolchain; 1.86 still
# fails. `scripts/qa/msrv.sh` re-checks it, because a promise nobody tests drifts the first
# time someone uses a newer feature — and the first to find out is a user on an older Rust.
rust-version = "1.87"

[workspace.dependencies]
ed25519-dalek = "3"
blake2 = "0.10"
hex = "0.4"
radix-common = "1.3.1"
radix-transactions = "1.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrypt = { version = "0.12", default-features = false }
aes-gcm = { version = "0.11", features = ["alloc"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["time"] }

# Internal SDK crates (path during development + version for crates.io publishing).
radixdlt-i18n = { path = "crates/i18n", version = "0.2.0" }
radixdlt-address = { path = "crates/address", version = "0.2.0" }
radixdlt-rola = { path = "crates/rola", version = "0.2.0" }
radixdlt-keystore = { path = "crates/keystore", version = "0.2.0" }
radixdlt-gateway-tx = { path = "crates/gateway-tx", version = "0.2.0" }
radixdlt-connect-types = { path = "crates/connect-types", version = "0.2.0" }

[profile.release]
opt-level = 3
lto = true
