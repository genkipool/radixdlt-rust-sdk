# Isolated workspace: iroh pulls a large QUIC dependency tree. Keeping this crate out of
# the main SDK workspace avoids any resolution interaction with the webrtc tree of
# `radixdlt-connect`. Shares `radixdlt-i18n` by path. The developer's choice is at the
# crate level: `radixdlt-connect` (WebRTC) OR `radixdlt-connect-iroh` (QUIC: the mobile
# wallet over "Radix Connect over iroh v1", and pure-Rust SDK-to-SDK peers).
[workspace]

[package]
name = "radixdlt-connect-iroh"
description = "Iroh (QUIC) transport for the RadixDLT Rust SDK: talks to the Radix mobile wallet over Radix Connect over iroh v1, and connects pure-Rust SDK-to-SDK peers."
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/genkipool/radixdlt-rust-sdk"
authors = ["Luis Alberto Reoyo Bolaños <68571366+genkipool@users.noreply.github.com>"]
# iroh 1.4 (and `radix-connect-iroh`, edition 2024) require Rust 1.91.
rust-version = "1.91"
keywords = ["radix", "radixdlt", "iroh", "quic", "p2p"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
readme = "README.md"

[features]
# Answering wallet requests (`protocol::Wallet`): account proofs, transactions and
# pre-authorizations. ON by default, so nothing changes for anyone already using this crate.
#
# It is separable because the Scrypto engine it pulls pins `regex` to EXACTLY 1.9.3, while
# `webrtc` (the mobile-wallet transport) requires `>=1.9.5`. Those two cannot resolve in one
# dependency tree, so a crate that only relays bytes over iroh — and never builds or submits a
# transaction — used to be locked out of any workspace containing the mobile wallet, purely
# because of a dependency it did not use.
default = ["wallet"]
wallet = ["dep:radixdlt-gateway-tx"]

[dependencies]
radixdlt-i18n = { path = "../i18n", version = "0.3.0" }
radixdlt-connect-types = { path = "../connect-types", version = "0.3.0" }
radixdlt-address = { path = "../address", version = "0.3.0" }
radixdlt-rola = { path = "../rola", version = "0.3.0" }
radixdlt-keystore = { path = "../keystore", version = "0.3.0" }
# Only the `wallet` side needs this: it drags in the whole Scrypto engine (radix-engine,
# radix-transactions). Optional so that a caller wanting ONLY the iroh transport does not
# inherit it — see the note on the `wallet` feature below.
radixdlt-gateway-tx = { path = "../gateway-tx", version = "0.3.0", optional = true }
# 1.4: the version `radix-connect-iroh` is built and tested against.
iroh = "1.4.1"
# "Radix Connect over iroh v1", the protocol the Radix Wallet and the Connector Extension speak
# (the `mobile` module), from its published tag: a fresh checkout builds with nothing beside it.
# Not on crates.io yet, so it must become a registry dependency before this crate is published —
# `cargo publish` refuses a git dependency without a version, which is the reminder.
radix-connect-iroh = { git = "https://github.com/genkipool/radix-connect-iroh", tag = "v0.1.2" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
ed25519-dalek = "3"
hex = "0.4"
# One process per link on a machine (`mobile::lock`): an exclusive lock of the operating system.
fs4 = { version = "0.13", features = ["sync"] }
zeroize = "1.8"
# Structured logs of the `mobile` connector (links named by a hash, never the password).
tracing = "0.1"

[dev-dependencies]
# Integration tests run a real iroh relay in-process, over plain HTTP on 127.0.0.1.
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "tls-ring"] }
# The `mobile_login` example draws the pairing QR in the terminal.
radixdlt-connect-types = { path = "../connect-types", version = "0.3.0", features = ["qr"] }
getrandom = "0.4"
# `RUST_LOG=...` for the example and the log-hygiene test.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
