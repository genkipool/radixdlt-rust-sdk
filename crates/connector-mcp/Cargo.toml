# Isolated workspace: this binary depends on `radixdlt-connect-webrtc`, whose `webrtc`
# dependency tree cannot be resolved together with the main SDK workspace (same
# reason `radixdlt-connect-webrtc` itself is isolated). It shares the connect crates by
# path and publishes/installs independently from GitHub.
[workspace]

[package]
name = "radixdlt-connector-mcp"
description = "Local MCP (Model Context Protocol) server that lets AI agents pair a Radix Wallet and get transactions signed over Radix Connect (WebRTC). The signing runs on the user's machine; the wallet on their phone approves."
version = "0.8.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/genkipool/radixdlt-rust-sdk"
authors = ["Luis Alberto Reoyo Bolaños <68571366+genkipool@users.noreply.github.com>"]
rust-version = "1.87"
keywords = ["radix", "radixdlt", "mcp", "wallet", "radix-connect"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
readme = "README.md"

# The installed command is `radix-connector-mcp` (this is what MCP clients launch).
[[bin]]
name = "radix-connector-mcp"
path = "src/main.rs"

[dependencies]
# Pairing over iroh and WebRTC with one QR, and each request raced over both: the same piece
# every connector built on the SDK uses.
radixdlt-connect-auto = { path = "../connect-auto", version = "0.3.0" }
radixdlt-connect-webrtc = { path = "../connect-webrtc", version = "0.3.0" }
# `qr`: the QR encoder and terminal renderer shared with every program that pairs a wallet.
radixdlt-connect-types = { path = "../connect-types", version = "0.3.0", features = ["qr"] }
radixdlt-rola = { path = "../rola", version = "0.3.0" }
# Radix Connect over iroh, the second transport (`src/iroh.rs`). Without its `wallet` feature:
# that one pulls the Scrypto engine, whose exact `regex` pin cannot resolve with webrtc's.
radixdlt-connect-iroh = { path = "../connect-iroh", version = "0.3.0", default-features = false }
# The iroh libraries' own log events (link collisions, replaced connections, relay state…) into
# connector.log (`src/trace.rs`). Both are already in the tree through iroh.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# One connector process per wallet link over iroh (an OS file lock), as `radixdlt-connect-webrtc` does
# for WebRTC turns.
fs4 = { version = "0.13", features = ["sync"] }
zeroize = "1.8"
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Direct dependency ONLY to install rustls' default crypto provider — see main.rs. This binary
# links two of them (aws-lc-rs through reqwest, ring through webrtc), and rustls refuses to
# guess between them at runtime.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
radixdlt-address = { path = "../address", version = "0.3.0" }
# The end-to-end test over iroh (`src/e2e_iroh.rs`) reuses connect-iroh's simulated wallet and
# in-process relay (`../connect-iroh/tests/support`), which need these. The protocol library comes
# from the same published tag as connect-iroh's, so both are one crate.
radix-connect-iroh = { git = "https://github.com/genkipool/radix-connect-iroh", tag = "v0.1.2" }
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "tls-ring"] }
# The end-to-end tests stand in for the WebRTC signaling server with a socket on 127.0.0.1.
tokio = { version = "1", features = ["net"] }
