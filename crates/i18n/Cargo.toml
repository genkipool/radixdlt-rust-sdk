[package]
name = "radixdlt-i18n"
description = "System-locale detection and bilingual (English/Spanish) message helpers for the RadixDLT Rust SDK."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["radix", "radixdlt", "i18n", "locale", "sdk"]
categories = ["localization", "internationalization"]
readme = "README.md"

[dependencies]

# Windows keeps the language in the system, not in the environment: a service or LogonUI has no
# LANG at all. Asked of Windows itself, through a safe API.
[target.'cfg(windows)'.dependencies]
sys-locale = "0.3"

[lints]
workspace = true
