# The crate's former name, kept so that code depending on `radixdlt-connect` keeps building: it is
# `radixdlt-connect-webrtc`, re-exported. New code depends on `radixdlt-connect-webrtc` (WebRTC
# only), `radixdlt-connect-iroh` (iroh only) or `radixdlt-connect-auto` (both, chosen by itself).
# Isolated workspace, as `radixdlt-connect-webrtc`'s (its webrtc tree).
[workspace]

[package]
name = "radixdlt-connect"
description = "Former name of radixdlt-connect-webrtc (Radix Connect over WebRTC), which it re-exports. Use radixdlt-connect-webrtc, or radixdlt-connect-auto for iroh and WebRTC chosen automatically."
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/genkipool/radixdlt-rust-sdk"
authors = ["Luis Alberto Reoyo Bolaños <68571366+genkipool@users.noreply.github.com>"]
rust-version = "1.87"
keywords = ["radix", "radixdlt", "radix-connect", "webrtc", "wallet"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
readme = "README.md"

[dependencies]
radixdlt-connect-webrtc = { path = "../connect-webrtc", version = "0.3.0" }
